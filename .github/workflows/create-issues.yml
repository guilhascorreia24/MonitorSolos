name: Create Issues

on:
  workflow_dispatch:

jobs:
  create-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install axios fs

      - name: Run script
        run: node scripts/createIssues.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
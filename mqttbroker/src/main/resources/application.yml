spring:
  application:
    name: mqttbroker
  # Configuração do Broker MQTT
  mqtt:
    server-uri: ${MQTT_SERVER_URI:tcp://localhost:1883}

  # Configuração do Apache Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    
    # Configurações do Producer (quem envia)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Serializa o objeto SensorData para JSON
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    # Configurações do Consumer (quem recebe)
    consumer:
      group-id: "vineyard-group" # group-id padrão para os consumidores
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Deserializa o JSON de volta para o objeto SensorData
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Pacotes confiáveis para deserialização. Essencial por segurança.
        spring.json.trusted.packages: "com.vineyard.mqttbroker"

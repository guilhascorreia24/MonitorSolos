apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: vineyard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: SPRING_CLOUD_GATEWAY_ROUTES_0_ID
          value: "device-service"
        - name: SPRING_CLOUD_GATEWAY_ROUTES_0_URI
          valueFrom:
            configMapKeyRef:
              name: vineyard-config
              key: DEVICE_SERVICE_URL
        - name: SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0
          value: "Path=/api/devices/**"
        - name: SPRING_CLOUD_GATEWAY_ROUTES_1_ID
          value: "alert-service"
        - name: SPRING_CLOUD_GATEWAY_ROUTES_1_URI
          valueFrom:
            configMapKeyRef:
              name: vineyard-config
              key: ALERT_SERVICE_URL
        - name: SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0
          value: "Path=/api/alerts/**"
        - name: SPRING_CLOUD_GATEWAY_ROUTES_2_ID
          value: "analytics-service"
        - name: SPRING_CLOUD_GATEWAY_ROUTES_2_URI
          valueFrom:
            configMapKeyRef:
              name: vineyard-config
              key: ANALYTICS_SERVICE_URL
        - name: SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0
          value: "Path=/api/analytics/**"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: vineyard
spec:
  type: LoadBalancer # Entry point for API
  ports:
  - port: 8000
  selector:
    app: api-gateway

services:
  # Broker MQTT - Mosquitto
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto-broker
    ports:
      - "1883:1883" # Porta MQTT padrão
      - "9001:9001" # Websockets (opcional)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  # Zookeeper (Necessário para o Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092" # Exposto para o Host (Spring Boot)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Configuração de Listeners:
      # PLAINTEXT: Comunicação interna entre containers (porta 29092)
      # PLAINTEXT_HOST: Comunicação externa com o Host/Spring Boot (porta 9092)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Spring Boot Application
  broker-mqtt-spring-boot:
    build: mqttbroker/.
    container_name: broker-mqtt-spring-boot
    depends_on:
      - kafka
    ports:
      - "8080:8080" # Porta da aplicação Spring Boot
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS_DOCKER}"
      SPRING_MQTT_SERVER_URI: "${MQTT_SERVER_URI_DOCKER}"
      KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      KAFKA_CONSUMER_GROUP_ID: "vineyard-group"
      KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
      SPRING_JSON_TRUSTED_PACKAGES: "com.vineyard.mqttbroker"

  # PostgreSQL — Base de Dados Relacional
  postgres:
    image: postgres:15-alpine
    container_name: smart_vineyard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./baseDados/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ingestion Service — Consome Kafka e persiste no PostgreSQL
  ingestion-service:
    build: ingestion-service/.
    container_name: ingestion-service
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS_DOCKER}"
      SPRING_KAFKA_CONSUMER_GROUP_ID: "ingestion-group"
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: "org.apache.kafka.common.serialization.StringDeserializer"
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: "org.springframework.kafka.support.serializer.JsonDeserializer"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: "false"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: "com.vineyard.ingestion.model.SensorData"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"

  # InfluxDB — Base de Dados de Séries Temporais
  influxdb:
    image: influxdb:2.7-alpine
    container_name: influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: "${INFLUXDB_USER}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUXDB_PASSWORD}"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUXDB_ORG}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUXDB_BUCKET}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUXDB_ADMIN_TOKEN}"
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Analytics Service — Processa séries temporais, calcula risco de fungos, gera alertas
  analytics-service:
    build: analytics-service/.
    container_name: analytics-service
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      # PostgreSQL (para alertas)
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS_DOCKER}"
      SPRING_KAFKA_CONSUMER_GROUP_ID: "analytics-group"
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: "org.apache.kafka.common.serialization.StringDeserializer"
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: "org.springframework.kafka.support.serializer.JsonDeserializer"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: "false"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: "com.vineyard.analytics.model.SensorData"
      # InfluxDB
      INFLUXDB_URL: "${INFLUXDB_URL_DOCKER}"
      INFLUXDB_TOKEN: "${INFLUXDB_ADMIN_TOKEN}"
      INFLUXDB_ORG: "${INFLUXDB_ORG}"
      INFLUXDB_BUCKET: "${INFLUXDB_BUCKET}"

  # Alert Service — Gestão e notificação de alertas
  alert-service:
    build: alert-service/.
    container_name: alert-service
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS_DOCKER}"
      SPRING_KAFKA_CONSUMER_GROUP_ID: "alert-group"
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: "org.apache.kafka.common.serialization.StringDeserializer"
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: "org.springframework.kafka.support.serializer.JsonDeserializer"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS: "false"
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE: "com.vineyard.alert.model.AlertEvent"

  # Device Service — Gestão de dispositivos e utilizadores
  device-service:
    build: device-service/.
    container_name: device-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"

  # API Gateway — Ponto de entrada único
  api-gateway:
    build: api-gateway/.
    container_name: api-gateway
    depends_on:
      device-service:
        condition: service_started
      alert-service:
        condition: service_started
      analytics-service:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: "device-service"
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: "http://device-service:8084"
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: "Path=/api/devices/**"
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: "alert-service"
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: "http://alert-service:8083"
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: "Path=/api/alerts/**"
      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: "analytics-service"
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: "http://analytics-service:8082"
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: "Path=/api/analytics/**"

  # Grafana — Visualização e Dashboards
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    depends_on:
      - postgres
      - influxdb
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false

  # Dashboard WebApp — Interface do Produtor
  dashboard-webapp:
    build: dashboard-webapp/.
    container_name: dashboard-webapp
    depends_on:
      - api-gateway
    ports:
      - "3100:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - INTERNAL_API_URL=http://api-gateway:8000/api

volumes:
  postgres_data:
  influxdb_data:

